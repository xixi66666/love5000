<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f3e9">
  <title>鹈鹕的兜风时间</title>
  <style>
    :root { color-scheme: light; --ink: #273b3c; --paper: #f6f3e9; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; }
    button { font: inherit; }
    .page { width: min(1440px, 100%); margin: 0 auto; padding: 30px 44px 22px; }
    .masthead { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
    .brand { display: flex; align-items: center; gap: 11px; font-size: 13px; font-weight: 700; letter-spacing: 2px; }
    .brand svg { width: 35px; height: 35px; }
    .edition { font-size: 11px; letter-spacing: 2px; color: #7a8880; }
    .scene { position: relative; isolation: isolate; overflow: hidden; border: 1px solid #e0e4d6; border-radius: 28px; background: #e9efe2; }
    .landscape { display: block; width: 100%; height: auto; }
    .intro { position: absolute; z-index: 1; top: 8%; left: 6%; pointer-events: none; }
    .eyebrow { margin: 0 0 16px; color: #5b7a70; font-size: 10px; font-weight: 700; letter-spacing: 3px; }
    h1 { margin: 0; font-size: clamp(24px, 3.8vw, 54px); line-height: 1.3; font-weight: 500; letter-spacing: 3px; }
    .intro p:last-child { margin: 17px 0 0; font-size: clamp(10px, 1.05vw, 14px); color: #6a8074; letter-spacing: 1px; }
    .scene-bottom { position: absolute; z-index: 2; bottom: 5%; left: 6%; right: 5%; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .caption { display: flex; align-items: center; gap: 9px; color: #65786a; font-size: 11px; letter-spacing: 1px; }
    .caption i { width: 6px; height: 6px; border-radius: 50%; background: #6c917a; }
    .toggle { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-width: 104px; min-height: 42px; padding: 10px 18px; border: 1px solid #bccbb4; border-radius: 99px; background: #f6f8eddd; color: #3d5c4c; font-size: 12px; cursor: pointer; transition: background .2s, transform .2s; }
    .toggle:hover { background: #fffdf2; transform: translateY(-2px); }
    .toggle:focus-visible { outline: 3px solid #e5a351; outline-offset: 4px; }
    .toggle svg { width: 13px; height: 13px; fill: currentColor; }
    .footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-top: 17px; color: #879083; font-size: 10px; letter-spacing: 1.5px; }
    .footer em { font-family: Georgia, serif; font-size: 13px; font-weight: normal; }
    @media (min-width: 1500px) { .page { padding-top: 40px; } }
    @media (max-width: 650px) {
      .page { padding: 18px 14px; }
      .masthead { margin-bottom: 15px; }
      .brand { font-size: 11px; letter-spacing: 1px; }
      .edition { font-size: 9px; letter-spacing: 1px; }
      .scene { border-radius: 20px; }
      .landscape { width: 155%; max-width: none; margin-left: -27.5%; margin-top: 54px; }
      .intro { top: 24px; left: 24px; }
      .eyebrow { margin-bottom: 8px; font-size: 8px; letter-spacing: 2px; }
      h1 { font-size: 26px; line-height: 1.25; letter-spacing: 1px; }
      .intro p:last-child { margin-top: 9px; font-size: 10px; }
      .scene-bottom { bottom: 20px; left: 24px; right: 20px; }
      .caption { font-size: 9px; letter-spacing: 0; }
      .toggle { min-width: 85px; min-height: 36px; padding: 8px 12px; font-size: 10px; }
      .footer { font-size: 8px; letter-spacing: .7px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="masthead">
      <div class="brand">
        <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="#dce6d2"/><path d="M10 25c0-6 4-7 7-7 2-1 1-7 5-8 3-1 5 1 5 4l7 2-7 3c-2 7-4 11-11 10Z" fill="#fffdf1"/><path d="m26 14 8 2-8 3" fill="#e9ae50"/><circle cx="24" cy="13" r="1.2" fill="#273b3c"/></svg>
        <span>慢游俱乐部</span>
      </div>
      <span class="edition">A LITTLE RIDE / No. 01</span>
    </header>

  <script>
    (() => {
      'use strict';
      const byId = id => document.getElementById(id);
      const nodes = Object.fromEntries([
        'rear-wheel', 'front-wheel', 'crank', 'cyclist', 'pelican', 'scarf',
        'clouds', 'distant-trees', 'road-marks', 'foreground', 'shadow',
        'breeze-one', 'breeze-two', 'front-leg-outline', 'front-leg-line',
        'back-leg-outline', 'back-leg-line', 'front-foot', 'back-foot'
      ].map(id => [id, byId(id)]));
      const toggle = byId('toggle');
      const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
      let running = !motionPreference.matches;
      let elapsed = 0;
      let previousTime = null;
      let frameId = null;

      function transform(id, value) { nodes[id].setAttribute('transform', value); }

      // 两段腿骨的逆向运动学，让脚始终落在转动的脚踏上。
      function drawLeg(side, phase, bodyBob) {
        const hipX = side === 'front' ? 660 : 651;
        const hipY = 472 + bodyBob;
        const pedalX = 685 + 42 * Math.cos(phase);
        const pedalY = 657 + 42 * Math.sin(phase);
        const ankleX = pedalX - 9;
        const ankleY = pedalY - 10;
        const dx = ankleX - hipX;
        const dy = ankleY - hipY;
        const distance = Math.hypot(dx, dy);
        const upperLength = 110;
        const lowerLength = 123;
        const along = (upperLength ** 2 - lowerLength ** 2 + distance ** 2) / (2 * distance);
        const bend = Math.sqrt(Math.max(0, upperLength ** 2 - along ** 2));
        const kneeX = hipX + along * dx / distance + bend * dy / distance;
        const kneeY = hipY + along * dy / distance - bend * dx / distance;
        const path = `M${hipX} ${hipY} L${kneeX} ${kneeY} L${ankleX} ${ankleY}`;
        nodes[`${side}-leg-outline`].setAttribute('d', path);
        nodes[`${side}-leg-line`].setAttribute('d', path);
        transform(`${side}-foot`, `translate(${pedalX} ${pedalY})`);
      }

      function render(time) {
        const phase = time * 3.6 - .65;
        const degrees = phase * 180 / Math.PI;
        const bodyBob = Math.sin(phase * 2) * 2;
        transform('rear-wheel', `rotate(${degrees * 1.65})`);
        transform('front-wheel', `rotate(${degrees * 1.65})`);
        transform('crank', `rotate(${degrees} 685 657)`);
        transform('cyclist', `translate(0 ${Math.sin(phase * 2) * 1.2})`);
        transform('pelican', `translate(0 ${bodyBob})`);
        transform('scarf', `rotate(${Math.sin(time * 6) * 3} 710 357)`);
        drawLeg('front', phase, bodyBob);
        drawLeg('back', phase + Math.PI, bodyBob);
        transform('clouds', `translate(${-((time * 9) % 1540)} 0)`);
        transform('distant-trees', `translate(${-((time * 27) % 1520)} 0)`);
        transform('road-marks', `translate(${-((time * 175) % 1400)} 0)`);
        transform('foreground', `translate(${-((time * 175) % 1400)} 0)`);
        transform('shadow', `translate(720 780) scale(${1 + Math.sin(phase * 2) * .014} 1) translate(-720 -780)`);
        nodes['breeze-one'].setAttribute('opacity', .4 + Math.sin(time * 2) * .2);
        nodes['breeze-two'].setAttribute('opacity', .4 + Math.cos(time * 2) * .2);
      }

      // 拼接相同景物，使背景连续循环；使用 SVG 本身，无外部资源。
      function repeatScenery(id, width) {
        const group = nodes[id];
        const original = Array.from(group.children);
        for (const child of original) {
          const copy = child.cloneNode(true);
          const wrapper = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          wrapper.setAttribute('transform', `translate(${width} 0)`);
          wrapper.appendChild(copy);
          group.appendChild(wrapper);
        }
      }

      function tick(timestamp) {
        if (!running) return;
        if (previousTime !== null) elapsed += Math.min((timestamp - previousTime) / 1000, .05);
        previousTime = timestamp;
        render(elapsed);
        frameId = requestAnimationFrame(tick);
      }

      function syncControl() {
        toggle.setAttribute('aria-pressed', String(!running));
        toggle.setAttribute('aria-label', running ? '暂停骑行动画' : '继续骑行动画');
        byId('control-label').textContent = running ? '歇一会儿' : '继续兜风';
        byId('control-icon').setAttribute('d', running ? 'M4 3h3v10H4zm5 0h3v10H9z' : 'M4 2.5 13 8l-9 5.5Z');
      }

      function setRunning(value) {
        running = value;
        if (frameId !== null) cancelAnimationFrame(frameId);
        frameId = null;
        previousTime = null;
        syncControl();
        if (running && !document.hidden) frameId = requestAnimationFrame(tick);
      }

      repeatScenery('clouds', 1540);
      repeatScenery('distant-trees', 1520);
      repeatScenery('road-marks', 1400);
      repeatScenery('foreground', 1400);
      toggle.addEventListener('click', () => setRunning(!running));
      document.addEventListener('visibilitychange', () => setRunning(running));
      motionPreference.addEventListener('change', event => setRunning(!event.matches));
      render(0);
      setRunning(running);
    })();
  </script>
</body>
</html>
