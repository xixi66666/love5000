server:
  address: 127.0.0.1
  port: ${PERSONAL_AGENT_PORT:5178}
  servlet:
    session:
      cookie:
        name: PERSONAL_AGENT_SESSION
        http-only: true
        same-site: strict
      timeout: 8h
spring:
  application:
    name: personal-agent
  jackson:
    serialization:
      write-dates-as-timestamps: false
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
agent:
  data-dir: ${PERSONAL_AGENT_DATA_DIR:}
  # 留空使用默认仓库：Windows 为 D:/个人资料/Obsidian Vault；其他系统在服务数据目录下。
  vault-dir: ${PERSONAL_AGENT_VAULT_DIR:}
  quartz-dir: ${PERSONAL_AGENT_QUARTZ_DIR:}
  node-command: ${PERSONAL_AGENT_NODE_COMMAND:node}
  api-base: ${PERSONAL_AGENT_API_BASE:https://api.deepseek.com}
  model: ${PERSONAL_AGENT_MODEL:deepseek-flash}
  api-key: ${PERSONAL_AGENT_API_KEY:}
