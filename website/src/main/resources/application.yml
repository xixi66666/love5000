spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    username: ${WEBSITE_DB_USERNAME:root}
    password: ${WEBSITE_DB_PASSWORD:}
    url: ${WEBSITE_DB_URL:jdbc:mysql://127.0.0.1:3306/ycx_pms?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    driver-class-name: com.mysql.cj.jdbc.Driver

  web:
    resources:
      static-locations:
        - classpath:/static/

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.example.website.blog.model,com.example.common.auth.model
  configuration:
    map-underscore-to-camel-case: true

python-a:
  auto-start:
    enabled: true
    work-dir: website/python-a
    command: python
    port: 5174
    health-path: /api/health
    startup-timeout-seconds: 20
    log-to-console: true

quant-a:
  auto-start:
    enabled: true
    work-dir: website/quant-a
    command: python
    port: 5175
    health-path: /api/health
    startup-timeout-seconds: 30
    log-to-console: true

website:
  service-health:
    connect-timeout-ms: 2000
    read-timeout-ms: 3000
    services:
      - name: lovestory
        url: http://127.0.0.1:8081/api/health
      - name: imagetemplate
        url: http://127.0.0.1:8082/api/health
      - name: guitar
        url: http://127.0.0.1:8088/api/health
      - name: python-a
        url: http://127.0.0.1:5174/api/health
      - name: quant-a
        url: http://127.0.0.1:5175/api/health
