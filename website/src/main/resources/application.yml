spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    username: ${WEBSITE_DB_USERNAME:root}
    password: ${WEBSITE_DB_PASSWORD:kuosi}
    url: ${WEBSITE_DB_URL:jdbc:mysql://49.232.128.132:3306/xixi?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    driver-class-name: com.mysql.cj.jdbc.Driver

  web:
    resources:
      static-locations:
        - classpath:/static/

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.example.common.auth.model,com.example.website.prompt.library.model
  configuration:
    map-underscore-to-camel-case: true

python-a:
  auto-start:
    enabled: true
    work-dir: website/python-a
    command: python
    port: 5174
    health-path: /api/health
    startup-timeout-seconds: 20
    log-to-console: true

quant-a:
  auto-start:
    enabled: true
    work-dir: website/quant-a
    command: python
    port: 5175
    health-path: /api/health
    startup-timeout-seconds: 30
    log-to-console: true

scrapling-ui:
  click-start:
    enabled: true
    work-dir: website/scrapling-ui
    command: ${SCRAPLING_UI_COMMAND:uv}
    port: 5176
    health-path: /api/health
    startup-timeout-seconds: 90
    log-to-console: true

skill-finder:
  click-start:
    enabled: true
    work-dir: website/skill-finder
    command: uv
    port: 5177
    health-path: /api/health
    startup-timeout-seconds: 90
    log-to-console: true

personal-agent:
  click-start:
    enabled: true
    work-dir: personal-agent
    command: ${PERSONAL_AGENT_COMMAND:}
    port: 5178
    health-path: /api/health
    startup-timeout-seconds: 90
    log-to-console: true

website:
  local-services:
    strata-dir: ${STRATA_HOME:F:/model/Strata}
    aimedia-dir: ${AIMEDIA_HOME:D:/Code/Java_Code/AIMedia}
    strata-port: 9999
    studio-port: 8190
    h3-port: 8189
    startup-timeout-seconds: 180
  service-health:
    connect-timeout-ms: 2000
    read-timeout-ms: 3000
    services:
      - name: lovestory
        url: http://127.0.0.1:8081/api/health
      - name: imagetemplate
        url: http://127.0.0.1:8082/api/health
      - name: python-a
        url: http://127.0.0.1:5174/api/health
      - name: quant-a
        url: http://127.0.0.1:5175/api/health
      - name: scrapling-ui
        url: http://127.0.0.1:5176/api/health
      - name: skill-finder
        url: http://127.0.0.1:5177/api/health
      - name: strata
        url: http://127.0.0.1:8080/api/services/local/strata/health
      - name: aimedia
        url: http://127.0.0.1:8080/api/services/local/aimedia/health
      - name: h3
        url: http://127.0.0.1:8080/api/services/local/h3/health
      - name: personal-agent
        url: http://127.0.0.1:5178/api/health
