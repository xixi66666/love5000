<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>XiXi 小屋 · 个人服务宇宙</title>
    <meta name="description" content="XiXi 小屋的电影化个人服务入口，连接恋爱相册、图片模板、Prompt Console 与 AI 研究工作台。">
    <meta name="keywords" content="Spring Boot, AI, Microservice">
    <meta name="theme-color" content="#05080b">
    <link rel="icon" type="image/png" sizes="1024x1024" href="img/moon-icon.png?v=6.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Noto+Serif+SC:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=7.4">
</head>

<body>
<a class="skip-link" href="#service-dock">跳到服务入口</a>

<section class="cinematic-hero" id="home" aria-labelledby="hero-title">
    <div class="scene-background" aria-hidden="true">
        <video class="scene-video is-active" data-scene-video="0" autoplay muted loop playsinline preload="none">
            <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260702_081127_0992a171-d3c6-4978-8213-0ec5df8b6d63.mp4" type="video/mp4">
        </video>
        <video class="scene-video" data-scene-video="1" muted loop playsinline preload="none">
            <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260702_092026_dd05b805-ea0f-40b2-8c52-332b88502592.mp4" type="video/mp4">
        </video>
        <video class="scene-video" data-scene-video="2" muted loop playsinline preload="none">
            <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260702_081042_df7202bf-bd80-4b2b-bbc6-1f09ba2870e9.mp4" type="video/mp4">
        </video>
        <video class="scene-video" data-scene-video="3" muted loop playsinline preload="none">
            <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260702_080959_4cac5234-3573-464e-a5b7-76b94b8a7d61.mp4" type="video/mp4">
        </video>
        <img class="scene-overlay" src="https://soft-zoom-63098134.figma.site/_assets/v11/0b4a435b2df2747593c43d7a1c9b4578f7d8d90c.png" alt="" loading="lazy">
        <div class="scene-shade"></div>
        <div class="scene-grain"></div>
    </div>

    <div class="page-shell">
        <header class="site-header">
            <a class="brand" href="#home" aria-label="返回 XiXi 小屋首页">
                <span class="brand-orbit" aria-hidden="true"></span>
                <span class="brand-name">XiXi</span>
            </a>

            <nav class="desktop-navigation liquid-glass" aria-label="账户操作">
                <button class="nav-auth-link auth-login-button" type="button">登录</button>
                <button class="nav-auth-link auth-register-button" type="button">注册</button>
                <button class="nav-auth-link auth-logout-button" type="button" hidden>退出</button>
            </nav>
        </header>

        <main class="hero-content">
            <div class="hero-copy">
                <p class="hero-badge liquid-glass">
                    <span class="badge-pulse" aria-hidden="true"></span>
                    6 个微服务，正在同一片宇宙中运行
                </p>
                <h1 id="hero-title">醉后不知天在水</h1>
                <p class="hero-statement">
                    满船清梦压星河
                </p>

                <div class="scene-switcher" role="group" aria-label="切换背景场景">
                    <button class="scene-button is-active" type="button" data-scene-index="0" aria-pressed="true">
                        <span>01</span> Golden Hour
                    </button>
                    <button class="scene-button" type="button" data-scene-index="1" aria-pressed="false">
                        <span>02</span> Still Water
                    </button>
                    <button class="scene-button" type="button" data-scene-index="2" aria-pressed="false">
                        <span>03</span> Deep Woods
                    </button>
                    <button class="scene-button" type="button" data-scene-index="3" aria-pressed="false">
                        <span>04</span> Quiet Dawn
                    </button>
                </div>
            </div>
        </main>

        <section class="service-dock liquid-glass" id="service-dock" aria-labelledby="services-title">
            <div class="service-dock-heading">
                <div>
                    <span class="eyebrow">LIVE DIRECTORY</span>
                </div>
                <span class="dock-hint">横向滑动探索全部服务</span>
            </div>

            <nav class="service-grid" aria-label="微服务入口">
                <a class="service-card" href="http://localhost:8081/login.html" target="_blank" rel="noopener"
                   data-health-url="http://localhost:8081/login.html" data-health-mode="no-cors">
                    <span class="service-index">01</span>
                    <span class="service-copy"><strong>恋爱相册</strong><small>LOVE STORY · 8081</small></span>
                    <span class="service-status" aria-label="检测中" title="检测中"></span>
                </a>
                <a class="service-card" href="http://localhost:8082/index.html" target="_blank" rel="noopener"
                   data-auth-required="true" data-auth-target-name="图片模板"
                   data-health-url="http://localhost:8082/index.html" data-health-mode="no-cors">
                    <span class="service-index">02</span>
                    <span class="service-copy"><strong>图片模板</strong><small>IMAGE LAB · 8082</small></span>
                    <span class="service-status" aria-label="检测中" title="检测中"></span>
                </a>
                <a class="service-card" href="prompt-console/index.html" data-health-url="/prompt-console/index.html">
                    <span class="service-index">03</span>
                    <span class="service-copy"><strong>Prompt</strong><small>CONSOLE · 8080</small></span>
                    <span class="service-status" aria-label="检测中" title="检测中"></span>
                </a>
                <a class="service-card" href="http://127.0.0.1:5174/" target="_blank" rel="noopener"
                   data-health-url="http://127.0.0.1:5174/api/health" data-health-mode="no-cors">
                    <span class="service-index">04</span>
                    <span class="service-copy"><strong>A 股研究台</strong><small>AI RESEARCH · 5174</small></span>
                    <span class="service-status" aria-label="检测中" title="检测中"></span>
                </a>
                <a class="service-card" href="http://127.0.0.1:5175/" target="_blank" rel="noopener"
                   data-health-url="http://127.0.0.1:5175/api/health" data-health-mode="no-cors">
                    <span class="service-index">05</span>
                    <span class="service-copy"><strong>Quant 研究台</strong><small>QUANT LAB · 5175</small></span>
                    <span class="service-status" aria-label="检测中" title="检测中"></span>
                </a>
                <a class="service-card" href="http://127.0.0.1:5176/" target="_blank" rel="noopener"
                   data-health-url="http://127.0.0.1:5176/api/health" data-health-mode="no-cors"
                   data-start-url="/api/services/scrapling-ui/start" data-app-url="http://127.0.0.1:5176/">
                    <span class="service-index">06</span>
                    <span class="service-copy"><strong>Scrapling 抓取工坊</strong><small>SCRAPLING UI · 5176</small></span>
                    <span class="service-status" aria-label="检测中" title="检测中"></span>
                </a>
            </nav>
        </section>
    </div>

</section>

<div class="auth-pop-up" aria-hidden="true">
    <form class="auth-pop-up-main liquid-glass" novalidate>
        <button class="auth-pop-up-close" type="button" aria-label="关闭登录窗口">×</button>
        <span class="auth-kicker">MEMBER ACCESS</span>
        <div class="auth-pop-up-title">登录</div>
        <p class="auth-pop-up-copy">登录后可以访问受保护项目，并保持当前工作区连接。</p>
        <label>
            <span>用户名</span>
            <input class="auth-username" name="username" autocomplete="username" required>
        </label>
        <label class="auth-display-name-wrap" hidden>
            <span>显示名称</span>
            <input class="auth-display-name" name="displayName" autocomplete="nickname">
        </label>
        <label>
            <span>密码</span>
            <input class="auth-password" name="password" type="password" autocomplete="current-password" required>
        </label>
        <div class="auth-message" aria-live="polite"></div>
        <button class="auth-submit-button" type="submit">继续</button>
    </form>
</div>

<script src="js/vendor/gsap.min.js"></script>
<script src="js/script.js?v=7.5"></script>
</body>

</html>
