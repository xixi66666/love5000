server {
    listen 443 ssl http2;
    server_name 49.232.128.132;
    ssl_certificate /opt/skill-finder/letsencrypt/live/49.232.128.132/fullchain.pem;
    ssl_certificate_key /opt/skill-finder/letsencrypt/live/49.232.128.132/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 30m;
    location = /skill-finder { return 302 /skill-finder/; }
    location /skill-finder/ {
        proxy_pass http://127.0.0.1:15177/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
    location / {
        proxy_pass http://127.0.0.1:80;
        proxy_set_header Host 127.0.0.1;
    }
}
