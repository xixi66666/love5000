# Install alongside existing vhosts. Preserve the original default-IP site at /.
server {
    listen 80;
    server_name 49.232.128.132;
    location ^~ /.well-known/acme-challenge/ {
        root /opt/skill-finder/acme;
    }
    location = /skill-finder { return 302 /skill-finder/; }
    location /skill-finder/ {
        # Read-only over plaintext HTTP. Approval requires HTTPS or an SSH tunnel.
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:15177/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location / {
        proxy_pass http://127.0.0.1:80;
        proxy_set_header Host 127.0.0.1;
    }
}
