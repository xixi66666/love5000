<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Skill Finder · {{DAY}}</title>
<style>
{{THEME_CSS}}
*{box-sizing:border-box}html,body{margin:0;padding:0;width:{{WIDTH}}px;height:{{HEIGHT}}px;overflow:hidden;background:var(--background);color:var(--foreground)}body{font-family:sans-serif;-webkit-font-smoothing:antialiased}
#daily{position:relative;width:{{WIDTH}}px;height:{{HEIGHT}}px;overflow:hidden;background:var(--background)}
.scene{position:absolute;inset:0;overflow:hidden;background:var(--background);padding:84px var(--safeRight) 80px 76px;visibility:hidden}
header{display:flex;justify-content:space-between;align-items:center;border-top:3px solid var(--foreground);padding-top:22px;font-size:23px;letter-spacing:1px;font-weight:700}.date{font-size:21px;letter-spacing:0}.brand{color:var(--accent)}
.label{position:absolute;top:202px;left:76px;right:var(--safeRight);color:var(--accent);font-size:27px;letter-spacing:2px;font-weight:800}.counter{float:right;color:var(--foreground);font-size:22px;letter-spacing:1px}
h1{position:absolute;top:245px;left:76px;right:var(--safeRight);font-size:var(--headlineSize);line-height:1.1;letter-spacing:-.025em;margin:0;font-weight:900;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.summary{position:absolute;top:440px;left:80px;right:var(--safeRight);font-size:31px;line-height:1.6;margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;opacity:.75}
.media-window{position:absolute;top:var(--mediaTop);left:76px;right:var(--safeRight);height:var(--mediaHeight);overflow:hidden;background:#101618;border-radius:4px}.source-media{display:block;width:100%;height:100%;object-fit:contain;background:#101618}.media-rule{position:absolute;bottom:0;left:0;right:0;height:9px;background:var(--accent)}
.editorial-art{position:relative;width:100%;height:100%;padding:66px;color:var(--background);background:var(--foreground)}.editorial-art>span{font-size:250px;line-height:1;font-weight:900;color:var(--accent);letter-spacing:-15px}.editorial-art>strong{position:absolute;bottom:130px;left:66px;right:50px;font-size:40px;overflow-wrap:anywhere}.art-rule{position:absolute;bottom:100px;left:66px;width:90px;height:5px;background:var(--accent)}.editorial-art>small{position:absolute;bottom:52px;left:66px;font-size:21px;letter-spacing:5px}
.source{position:absolute;top:calc(var(--mediaTop) + var(--mediaHeight) + 20px);left:76px;right:var(--safeRight);font-size:20px;line-height:1.4;opacity:.6;overflow-wrap:anywhere;max-height:60px;overflow:hidden}.captions{position:absolute;bottom:var(--captionBottom);left:76px;right:var(--safeRight);height:calc(var(--captionSize) * 2.9 + 24px)}.caption{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:var(--captionSize);line-height:1.45;font-weight:800;visibility:hidden;white-space:pre-line;overflow:hidden;padding:8px 22px;border-radius:10px;background:color-mix(in srgb,var(--background) 96%,white)}
footer{position:absolute;bottom:110px;left:76px;right:var(--safeRight);display:flex;align-items:center;justify-content:space-between;border-top:2px solid var(--foreground);padding-top:22px;font-size:24px}footer>b{font-size:18px;letter-spacing:2px}.scene-progress{position:absolute;bottom:0;left:0;width:100%;height:12px;background:var(--accent);transform-origin:left center}
{{FONT_CSS}}
</style>
<script src="gsap.min.js"></script>
</head><body>
<main id="daily" data-composition-id="daily" data-width="{{WIDTH}}" data-height="{{HEIGHT}}" data-duration="{{DURATION}}">{{SCENES}}</main>
<script>
const root = document.querySelector('[data-composition-id]');
const timeline = gsap.timeline({paused:true});
const motion = Number(getComputedStyle(document.documentElement).getPropertyValue('--motion')) || 0;
for (const scene of root.querySelectorAll('.scene')) {
  const start = Number(scene.dataset.start), duration = Number(scene.dataset.duration);
  timeline.set(scene, {autoAlpha:1}, start);
  timeline.fromTo(scene.querySelector('h1'), {y:42*motion, opacity:0}, {y:0,opacity:1,duration:.45,ease:'power3.out'}, start+.03);
  timeline.fromTo(scene.querySelector('.media-window'), {y:30*motion,opacity:0}, {y:0,opacity:1,duration:.55,ease:'power2.out'}, start+.13);
  timeline.fromTo(scene.querySelector('.scene-progress'), {scaleX:0}, {scaleX:1,duration,ease:'none'}, start);
  for (const caption of scene.querySelectorAll('.caption')) {
    timeline.set(caption, {autoAlpha:1}, start+Number(caption.dataset.cueStart));
    timeline.set(caption, {autoAlpha:0}, start+Number(caption.dataset.cueEnd));
  }
  timeline.set(scene, {autoAlpha:0}, start+duration);
}
window.__timelines = {daily:timeline};
window.__renderReady = true;
timeline.pause(0);
</script>
</body></html>
