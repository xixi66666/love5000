<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Guitar 曲谱管理"><title>曲谱管理 · Guitar</title><link rel="stylesheet" href="/css/app.css"></head>
<body>
<a class="skip-link" href="#main">跳到主要内容</a>
<header class="site-header"><div class="header-inner"><a class="brand" href="/"><span>GUITAR</span><small>LOVE530 SHEET LIBRARY</small></a><nav class="nav" aria-label="主导航"><a href="/">曲谱库</a><a href="/profile.html">个人</a></nav></div></header>
<main id="main" class="page workspace-page"><div id="admin-app" hidden><header class="workspace-head"><div><p class="eyebrow">Phase 1 / 管理员</p><h1>曲谱治理</h1></div><p id="admin-status" aria-live="polite"></p></header>
  <form id="admin-filters" class="panel toolbar-form"><div class="field grow"><label for="admin-keyword">关键词</label><input id="admin-keyword" name="keyword" type="search" maxlength="120"></div><div class="field"><label for="admin-sheet-status">状态</label><select id="admin-sheet-status" name="status"><option value="">全部</option><option value="DRAFT">草稿</option><option value="PUBLISHED">已发布</option><option value="OFFLINE">已下架</option><option value="DELETED">已删除</option></select></div><div class="field"><label for="admin-sort">排序</label><select id="admin-sort" name="sort"><option value="LATEST">最近更新</option><option value="MOST_FAVORITED">收藏最多</option><option value="MOST_VIEWED">浏览最多</option></select></div><button class="button primary" type="submit">筛选</button></form>
  <section aria-labelledby="admin-list-title"><div class="section-head list-section-head"><h2 id="admin-list-title">曲谱列表</h2></div><div id="admin-sheets" class="admin-list" aria-live="polite"></div><div id="admin-pagination" class="pagination"></div></section></div></main>
<dialog id="offline-dialog" class="modal"><form id="offline-form"><input type="hidden" name="sheetId"><div class="modal-head"><h2>下架“<span id="offline-name"></span>”</h2><button class="icon-button" type="button" data-close-dialog aria-label="关闭"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div class="field"><label for="offline-reason">下架理由</label><textarea id="offline-reason" name="reason" rows="5" maxlength="500" required></textarea></div><p id="offline-error" class="field-error" role="alert"></p><div class="modal-actions"><button class="button secondary" type="button" data-close-dialog>取消</button><button class="button danger" type="submit">确认下架</button></div></form></dialog>
<dialog id="restore-dialog" class="modal"><div class="modal-head"><h2>恢复曲谱</h2><button class="icon-button" type="button" data-close-dialog aria-label="关闭"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><p>确认恢复“<strong id="restore-name"></strong>”并重新公开？</p><p id="restore-error" class="field-error" role="alert"></p><div class="modal-actions"><button class="button secondary" type="button" data-close-dialog>取消</button><button id="restore-action" class="button primary" type="button">确认恢复</button></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div><script type="module" src="/js/admin.js"></script>
</body></html>
