<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Guitar 登录与注册"><title>登录 · Guitar</title><link rel="stylesheet" href="/css/app.css"><style>.auth-form[hidden]{display:none}</style></head>
<body class="auth-page"><main class="auth-wrap"><a class="brand auth-back" href="/">← 返回曲谱库</a><section class="auth-panel" aria-labelledby="auth-title"><h1 id="auth-title">进入 Guitar</h1><p>保存收藏、上传曲谱，继续你的练习记录。</p><div class="tabs" role="tablist" aria-label="认证方式"><button type="button" role="tab" data-auth-tab="login" aria-selected="true" class="is-active">登录</button><button type="button" role="tab" data-auth-tab="register" aria-selected="false">注册</button></div><div id="form-error" class="form-error" role="alert" aria-live="polite"></div>
<form id="login-form" class="auth-form" autocomplete="on"><div class="field"><label for="login-phone">手机号</label><input id="login-phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" required></div><div class="field"><label for="login-password">密码</label><div class="password-wrap"><input id="login-password" name="password" type="password" autocomplete="current-password" required><button class="password-toggle" type="button" data-password-toggle="login-password" aria-label="显示密码" aria-pressed="false" title="显示密码">◉</button></div></div><button class="button primary" type="submit">登录</button></form>
<form id="register-form" class="auth-form" autocomplete="on" hidden><div class="field"><label for="register-phone">手机号</label><input id="register-phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" required></div><div class="field"><label for="register-nickname">昵称</label><input id="register-nickname" name="nickname" type="text" autocomplete="nickname" maxlength="30" required></div><div class="field"><label for="register-password">密码</label><div class="password-wrap"><input id="register-password" name="password" type="password" autocomplete="new-password" required><button class="password-toggle" type="button" data-password-toggle="register-password" aria-label="显示密码" aria-pressed="false" title="显示密码">◉</button></div></div><button class="button primary" type="submit">创建账号</button></form>
</section></main><script type="module" src="/js/auth.js"></script></body></html>
