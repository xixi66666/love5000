<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Guitar 私人收藏夹"><title>收藏夹 · Guitar</title><link rel="stylesheet" href="/css/app.css"></head>
<body>
<a class="skip-link" href="#main">跳到主要内容</a>
<header class="site-header"><div class="header-inner"><a class="brand" href="/"><span>GUITAR</span><small>LOVE530 SHEET LIBRARY</small></a><nav class="nav" aria-label="主导航"><a href="/">曲谱库</a><a href="/upload.html" class="primary">上传</a><a href="/profile.html">个人</a></nav></div></header>
<main id="main" class="page workspace-page"><header class="workspace-head"><div><p class="eyebrow">私人曲谱库</p><h1>收藏夹</h1></div><p id="favorites-status" aria-live="polite">正在加载</p></header>
  <div id="favorites-app" class="favorites-layout">
    <aside class="folder-panel" aria-labelledby="folders-title"><div class="section-head"><h2 id="folders-title">收藏夹</h2><div class="icon-actions"><button id="rename-folder" class="icon-button" type="button" aria-label="重命名当前收藏夹" title="重命名" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button><button id="delete-folder" class="icon-button danger-text" type="button" aria-label="删除当前收藏夹" title="删除" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2m-9 0 1 14h8l1-14M10 11v5m4-5v5"/></svg></button></div></div><ul id="folder-list" class="folder-list"></ul><form id="create-folder-form" class="compact-form"><div class="field"><label for="new-folder-name">新建收藏夹</label><input id="new-folder-name" name="name" maxlength="50" required></div><p id="create-folder-error" class="field-error" role="alert"></p><button class="button primary" type="submit">新建</button></form></aside>
    <section aria-labelledby="favorite-sheets-title"><div class="section-head list-section-head"><h2 id="favorite-sheets-title">曲谱</h2></div><div id="favorite-sheets" class="compact-list" aria-live="polite"></div></section>
  </div>
</main>
<dialog id="folder-dialog" class="modal"><form id="folder-dialog-form" method="dialog"><input type="hidden" name="folderId"><div class="modal-head"><h2>重命名收藏夹</h2><button class="icon-button" type="button" data-close-dialog aria-label="关闭"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div class="field"><label for="folder-name">名称</label><input id="folder-name" name="name" maxlength="50" required></div><p id="folder-dialog-error" class="field-error" role="alert"></p><div class="modal-actions"><button class="button secondary" type="button" data-close-dialog>取消</button><button class="button primary" type="submit">保存</button></div></form></dialog>
<dialog id="confirm-dialog" class="modal"><div class="modal-head"><h2 id="confirm-title">删除收藏夹</h2><button class="icon-button" type="button" data-close-dialog aria-label="关闭"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><p id="confirm-message"></p><p id="confirm-error" class="field-error" role="alert"></p><div class="modal-actions"><button class="button secondary" type="button" data-close-dialog>取消</button><button id="confirm-action" class="button danger" type="button">确认删除</button></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div><script type="module" src="/js/favorites.js"></script>
</body></html>
