<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Guitar 公开曲谱检索"><title>曲谱检索 · Guitar</title><link rel="stylesheet" href="/css/app.css"><link rel="stylesheet" href="/css/discovery.css"><link rel="modulepreload" href="/js/api.js"></head>
<body>
<a class="skip-link" href="#main">跳到主要内容</a>
<header class="site-header"><div class="header-inner"><a class="brand" href="/"><span>GUITAR</span><small>LOVE530 SHEET LIBRARY</small></a><nav class="nav" aria-label="主导航"><a href="#search">检索</a><a href="/auth.html" data-auth-link>登录</a></nav></div></header>
<main id="main" class="page discovery-page">
  <section class="hero" aria-labelledby="page-title"><div><p class="eyebrow">公开曲谱库 / 8088</p><h1 id="page-title">找到下一首要练的歌</h1></div><p>按歌曲、歌手、调性和难度筛选公开曲谱，打开详情即可预览文件。</p></section>
  <div class="discovery-layout">
    <button class="button secondary filter-open" id="filter-open" type="button">筛选条件</button>
    <aside class="filter-drawer" id="filter-drawer" aria-label="曲谱筛选"><div class="drawer-head"><h2>筛选</h2><button class="icon-button" id="filter-close" aria-label="关闭筛选" type="button">×</button></div>
      <form id="search-form" class="search-form"><div class="field"><label for="keyword">关键词</label><input id="keyword" name="keyword" type="search" placeholder="歌曲、歌手或关键词" autocomplete="off"></div><div class="field"><label for="songName">歌曲名</label><input id="songName" name="songName" type="text"></div><div class="field"><label for="singer">歌手</label><input id="singer" name="singer" type="text"></div><div class="field"><label for="sheetType">曲谱类型</label><select id="sheetType" name="sheetType"><option value="">全部</option><option value="CHORD">和弦</option><option value="TAB">六线谱</option><option value="SCORE">五线谱</option></select></div><div class="field"><label for="difficulty">难度</label><select id="difficulty" name="difficulty"><option value="">全部</option><option value="BEGINNER">入门</option><option value="INTERMEDIATE">进阶</option><option value="ADVANCED">高级</option></select></div><div class="field"><label for="keySignature">调性</label><input id="keySignature" name="keySignature" type="text" placeholder="如 C、Am"></div><div class="field"><label for="capoPosition">变调夹</label><input id="capoPosition" name="capoPosition" type="number" min="0" max="12"></div><div class="field"><label for="tuning">调弦</label><input id="tuning" name="tuning" type="text" placeholder="如 Standard"></div><div class="field"><label for="sort">排序</label><select id="sort" name="sort"><option value="LATEST">最近更新</option><option value="MOST_FAVORITED">收藏最多</option><option value="MOST_VIEWED">浏览最多</option></select></div><button class="button primary" type="submit">应用筛选</button></form>
    </aside>
    <section class="results-panel" aria-labelledby="results-title"><div class="results-head"><div><p class="eyebrow">检索结果</p><h2 id="results-title">公开曲谱</h2></div><p id="results-status" aria-live="polite">正在加载</p></div><div id="results" class="sheet-list" aria-live="polite"></div><div id="pagination" class="pagination" aria-label="分页"></div></section>
  </div>
</main>
<script type="module" src="/js/index.js"></script>
</body></html>
