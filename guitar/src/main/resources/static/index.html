<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Guitar 曲谱资料库"><title>曲谱库 · Guitar</title><link rel="stylesheet" href="/css/app.css"></head>
<body>
<a class="skip-link" href="#main">跳到主要内容</a>
<header class="site-header"><div class="header-inner"><a class="brand" href="/"><span>GUITAR</span><small>LOVE530 SHEET LIBRARY</small></a><nav class="nav" aria-label="主导航"><a href="#search">曲谱</a><a href="/upload.html">上传</a><a href="/favorites.html">收藏</a><a class="primary" data-auth-link href="/auth.html">登录</a></nav></div></header>
<main id="main" class="page">
  <section class="hero" aria-labelledby="page-title"><div><p class="eyebrow">曲谱资料库 / 8088</p><h1 id="page-title">找到下一首要练的歌。</h1></div><p>按歌名、歌手或调式筛选公开曲谱，保持练习节奏。</p></section>
  <section id="search" class="search-panel" aria-labelledby="search-title"><h2 id="search-title" class="meta">检索曲谱</h2><form id="search-form" class="search-grid"><div class="field"><label for="keyword">关键词</label><input id="keyword" name="keyword" type="search" placeholder="歌名、歌手或关键词" autocomplete="off"></div><div class="field"><label for="sort">排序</label><select id="sort" name="sort"><option value="LATEST">最近更新</option><option value="MOST_FAVORITED">收藏最多</option><option value="MOST_VIEWED">浏览最多</option></select></div><button class="button primary" type="submit">搜索曲谱</button></form></section>
  <section id="empty-state" class="empty-state" aria-live="polite"><h2>从关键词开始</h2><p>输入歌名或歌手，查看可公开练习的曲谱。</p></section>
</main>
<script type="module">
import { apiRequest } from '/js/api.js';
import { loadSession, getSession } from '/js/session.js';
const form=document.querySelector('#search-form'), empty=document.querySelector('#empty-state'), authLink=document.querySelector('[data-auth-link]');
loadSession().then(user=>{ if(user){authLink.textContent=user.nickname||'个人';authLink.href='/profile.html';} }).catch(()=>{});
form.addEventListener('submit', async e=>{e.preventDefault(); const params=new URLSearchParams(new FormData(form)); try{const data=await apiRequest('/api/sheets?'+params); const count=data?.items?.length ?? data?.content?.length ?? 0; empty.querySelector('h2').textContent=count?'找到 '+count+' 份曲谱':'暂无匹配曲谱'; empty.querySelector('p').textContent=count?'请选择一份曲谱查看详情。':'换个关键词试试，或登录后上传你的版本。';}catch(error){empty.querySelector('h2').textContent='暂时无法加载';empty.querySelector('p').textContent=error.message||'请稍后重试';}});
</script>
</body></html>
